name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements*.txt

    # Pre-built packages only. The CI machines have compilers, so without this
    # a dependency that has no wheel for some Python would be compiled quietly
    # here and then fail on a user's computer that has no compiler.
    - name: Install dependencies
      run: pip install --only-binary=:all: -r requirements-dev.txt

    - name: Run tests (includes OCR on the bundled sample images)
      run: pytest -v
